<!DOCTYPE html>
<html>
<head>
    <title>GameChanger Widget</title>
    <style>body { margin: 0; padding: 0; overflow: hidden; }</style>
</head>
<body>
    <!-- YOUR GAMECHANGER DIV GOES HERE -->
   <div id="gc-scoreboard-widget-agnv"></div>
  <div id="gc-scoreboard-widget-0nt7"></div>
  <div id="gc-scoreboard-widget-0nzs"></div>
  <div id="gc-scoreboard-widget-bp30"></div>

<!-- PINTO -->  
<script src="https://widgets.gc.com/static/js/sdk.v1.js"></script>
<script>
    window.GC.scoreboard.init({
        target: "#gc-scoreboard-widget-agnv",
        widgetId: "a26267c1-7c63-49ad-a2a0-f35acc39b4d7",
        maxVerticalGamesVisible: 4,
    })
</script>
